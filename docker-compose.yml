services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: space_ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: space_mission_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d space_mission_ops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - space_ops_network

  # Redis 7 In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: space_ops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - space_ops_network

  # Node.js + Express REST API Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: space_ops_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/space_mission_ops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-mission-ops-jwt-key-2026-production
      JWT_EXPIRE: 7d
      AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - space_ops_network

  # React + TypeScript + Nginx Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: space_ops_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - space_ops_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  space_ops_network:
    driver: bridge
